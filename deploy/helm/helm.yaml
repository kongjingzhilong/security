apiVersion: templates.gatekeeper.sh/v1
kind: ConstraintTemplate
metadata:
  name: k8simagepolicy
spec:
  crd:
    spec:
      names:
        kind: K8sImagePolicy
      validation:
        openAPIV3Schema:
          type: object
          properties:
            blockedImages:
              type: array
              items:
                type: string
            blockedUsers:
              # k8s_client.py 生成的动态策略会传该字段(封禁用户),必须在 schema 中声明,
              # 否则 Gatekeeper 严格校验会报 unknown field "spec.parameters.blockedUsers"
              type: array
              items:
                type: integer
            severity:
              type: string
  targets:
    - target: admission.k8s.gatekeeper.sh
      rego: |
        package k8simagepolicy

        # 规则1: 禁止特权容器
        violation[{"msg": msg}] {
          container := input.review.object.spec.containers[_]
          container.securityContext.privileged == true
          msg := "[DYNAMIC BLOCK] 特权容器已被动态策略禁止"
        }

        # 规则2: 镜像黑名单匹配(支持前缀匹配)
        violation[{"msg": msg}] {
          container := input.review.object.spec.containers[_]
          image := container.image
          blocked := input.parameters.blockedImages[_]
          startswith(image, blocked)
          msg := sprintf("[DYNAMIC BLOCK] Image '%s' 已被攻击链检测为恶意 (severity: %s)", [image, input.parameters.severity])
        }

        # 规则3: 禁止 hostPath 挂载(防容器逃逸)
        violation[{"msg": msg}] {
          volume := input.review.object.spec.volumes[_]
          volume.hostPath
          msg := "[DYNAMIC BLOCK] hostPath 挂载已被动态策略禁止"
        }
---
apiVersion: constraints.gatekeeper.sh/v1beta1
kind: K8sImagePolicy
metadata:
  name: baseline-image-policy
spec:
  # 基线策略用 dryrun(仅审计/告警,不阻断):
  #   保证 POC 的 4 个攻击阶段能被成功创建→被 Falco 检测到→生成动态策略
  #   真正的阻断由下面动态生成的 deny 策略体现
  enforcementAction: dryrun
  match:
    kinds:
      - apiGroups: [""]
        kinds: ["Pod"]
  parameters:
    blockedImages: []
    severity: "baseline"
